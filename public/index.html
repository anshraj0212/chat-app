<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Talksy 💬</title>

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ===== Splash Screen ===== -->
  <div id="splash" class="splash">
    <img src="assets/talksy-logo.png" class="splash-logo" alt="Talksy" />
  </div>

  <!-- ===== Background ===== -->
  <div class="bg">
    <div class="mesh"></div>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="grain"></div>
  </div>

  <!-- ===== Login Page ===== -->
  <main class="wrap">
    <section class="login-box card">

      <div class="brand">
        <div class="heading-logo-tile">
          <img src="assets/talksy-logo.png" class="heading-logo" />
        </div>
        <h1 class="title">
          💬 Welcome to <span class="brand-text">Talksy</span>
        </h1>
      </div>

      <p class="subtitle">Private one-to-one. No sign-up. Vibe in.</p>

      <div class="field">
        <input
          type="text"
          id="username"
          class="input pill"
          placeholder="Enter your name"
          minlength="2"
          maxlength="24"
          autofocus
        />
      </div>

      <button id="joinBtn" class="btn pill" type="button" disabled>
        Join Chat
      </button>

      <div class="row">
        <small class="subtitle no-margin">
          Tip: press <kbd>Enter</kbd> to join
        </small>
      </div>
    </section>

    <!-- ===== Chat UI ===== -->
    <section class="chat-box hidden card-lg">

      <header class="chat-header">
        <div class="brand small">
          <img src="assets/talksy-logo.png" class="chat-logo" />
          <h3 class="chat-title">Talksy 💬</h3>
        </div>
        <div class="presence" id="presence">Online</div>
      </header>

      <div id="chatWindow" class="chat-window"></div>

      <!-- Typing indicator -->
      <div id="typingIndicator" class="typing hidden">
        <span id="typingText"><strong>Someone</strong> is typing</span>
        <span class="dots"><i></i><i></i><i></i></span>
      </div>

      <footer class="chat-input">
        <input type="text" id="receiver" class="input pill" placeholder="Receiver name" />
        <input type="text" id="message" class="input pill" placeholder="Type a message…" />
        <button id="recordBtn" class="btn pill record" type="button" disabled>Rec</button>
        <button id="sendBtn" class="btn pill send" type="button" disabled>Send</button>
      </footer>

    </section>
  </main>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>

</body>
</html>
