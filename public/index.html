<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Talksy</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="splash" class="splash">
    <img src="assets/talksy-logo.png" class="splash-logo" alt="Talksy" />
  </div>

  <div class="bg">
    <div class="mesh"></div>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="aurora-line a1"></div>
    <div class="aurora-line a2"></div>
    <div class="motion-layer" id="motionLayer" aria-hidden="true"></div>
    <div class="grain"></div>
  </div>

  <main class="wrap">
    <section class="login-box card">
      <div class="brand">
        <div class="heading-logo-tile">
          <img src="assets/talksy-logo.png" class="heading-logo" alt="" />
        </div>
        <h1 class="title">Welcome to <span class="brand-text">Talksy</span></h1>
      </div>

      <p class="subtitle">Private one-to-one. No sign-up. Vibe in.</p>

      <div class="field">
        <input
          type="text"
          id="username"
          class="input pill"
          placeholder="Enter your name"
          minlength="2"
          maxlength="24"
          autofocus
        />
      </div>

      <button id="joinBtn" class="btn pill" type="button" disabled>Join Chat</button>

      <div class="row">
        <small class="subtitle no-margin">Tip: press <kbd>Enter</kbd> to join</small>
      </div>
    </section>

    <section class="chat-box hidden card-lg">
      <aside class="contacts-panel">
        <div class="contacts-head">
          <div class="brand small">
            <img src="assets/talksy-logo.png" class="chat-logo" alt="" />
            <div>
              <h3 class="chat-title">Talksy</h3>
              <span id="currentUser" class="current-user"></span>
            </div>
          </div>
          <button id="changeUserBtn" class="ghost-btn" type="button">Change user</button>
        </div>

        <button id="newChatBtn" class="btn pill new-chat" type="button">New Chat</button>
        <div id="contactList" class="contact-list"></div>
      </aside>

      <section class="conversation-panel">
        <header class="chat-header">
          <div>
            <h3 id="chatTitle" class="chat-title">Select a chat</h3>
            <p id="chatSubtitle" class="chat-subtitle">Choose a recent contact or start a new chat.</p>
          </div>
          <div class="presence" id="presence">Online</div>
        </header>

        <div id="chatWindow" class="chat-window"></div>

        <div id="typingIndicator" class="typing hidden">
          <span id="typingText"><strong>Someone</strong> is typing</span>
          <span class="dots"><i></i><i></i><i></i></span>
        </div>

        <footer class="chat-input">
          <textarea id="message" class="input message-input" placeholder="Type a message..." rows="1" disabled></textarea>
          <button id="recordBtn" class="btn pill record" type="button" disabled>Rec</button>
          <button id="sendBtn" class="btn pill send" type="button" disabled>Send</button>
        </footer>
      </section>
    </section>
  </main>

  <div id="newChatModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="newChatTitle">
    <div class="modal-card">
      <button id="modalCloseBtn" class="modal-close" type="button" aria-label="Close">x</button>

      <div class="modal-mark">
        <img src="assets/talksy-logo.png" alt="" />
      </div>

      <h2 id="newChatTitle" class="modal-title">Start a new chat</h2>
      <p class="modal-copy">Enter your friend's Talksy name once. It will stay in your recent chats.</p>

      <label class="modal-label" for="modalReceiverInput">Receiver name</label>
      <input
        type="text"
        id="modalReceiverInput"
        class="input modal-input"
        placeholder="e.g. ansh"
        maxlength="24"
      />
      <p id="modalError" class="modal-error hidden"></p>

      <div class="modal-actions">
        <button id="modalCancelBtn" class="ghost-btn modal-secondary" type="button">Cancel</button>
        <button id="modalStartBtn" class="btn pill modal-primary" type="button">Start Chat</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
